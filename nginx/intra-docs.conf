server {
    listen 80;
    server_name _;

    root /srv/intra-docs/current;
    index index.html;

    # Always revalidate generated HTML so new deployments are visible after refresh.
    location ~* \.html?$ {
        gzip_static on;
        add_header Cache-Control "no-cache";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Keep historical URLs:
    # /RCOS_API_DOC.html and /5gos_liuyd.html
    location / {
        try_files $uri $uri/ =404;
    }
}
