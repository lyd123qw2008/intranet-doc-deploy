<!DOCTYPE html>
<html$if(lang)$ lang="$lang$"$endif$>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$if(title-prefix)$$title-prefix$ - $endif$$pagetitle$</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230969da'/%3E%3Cpath d='M18 16h28a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6Z' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M23 26h18M23 33h12M23 40h18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0969da" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('sidebar-init-pending');
      try {
        var storedSidebar = localStorage.getItem('doc-sidebar') || '';
        if (storedSidebar === 'collapsed') {
          root.classList.add('sidebar-collapsed');
        } else {
          root.classList.remove('sidebar-collapsed');
        }
      } catch (e) {
        root.classList.remove('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    /* Critical sidebar/layout CSS */
    .layout {
      width: 100%;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: grid;
      grid-template-columns: 284px minmax(0, 1fr);
      gap: 0;
      align-items: start;
    }

    html.sidebar-init-pending .layout {
      opacity: 0;
    }

    html.sidebar-init-ready .layout {
      opacity: 1;
      transition: opacity 90ms ease-out;
    }

    .toc-panel {
      display: block;
    }

    html.sidebar-collapsed .layout,
    body.sidebar-collapsed .layout {
      grid-template-columns: 1fr;
      gap: 0;
      padding-left: 0;
    }

    html.sidebar-collapsed .toc-panel,
    body.sidebar-collapsed .toc-panel {
      display: none;
    }

  </style>
  <style id="github-markdown-css">
__GITHUB_MARKDOWN_CSS_INLINE__
  </style>
  $if(highlighting-css)$
  <style id="docs-runtime-css">
$highlighting-css$
  </style>
  $endif$
  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --sidebar-bg: #f6f8fa;
      --line: #d1d9e0;
      --text: #1f2328;
      --muted: #59636e;
      --code-bg: #f6f8fa;
      --code-bg-transparent: rgba(246, 248, 250, 0);
      --code-border: #d1d9e0;
      --table-head: #f6f8fa;
      --table-zebra: #fcfcfd;
      --brand: #0969da;
      --brand-soft: #ddf4ff;
      --danger-fg: #cf222e;
      --toc-hover: #eff2f5;
      --toc-text: #59636e;
      --input-bg: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover: #eff2f5;
      --scrollbar-thumb: #8c959f;
      --scrollbar-thumb-hover: #6e7781;
      --shadow: 0 6px 16px rgba(27, 31, 35, 0.12);
      --floating-bg: rgba(255, 255, 255, 0.92);
      --floating-shadow: 0 6px 16px rgba(27, 31, 35, 0.14);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    html[data-theme='dark'] {
      --bg: #0d1117;
      --panel: #161b22;
      --sidebar-bg: #0f141b;
      --line: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --code-bg: #161b22;
      --code-bg-transparent: rgba(22, 27, 34, 0);
      --code-border: #30363d;
      --table-head: #161b22;
      --table-zebra: #161b22;
      --brand: #58a6ff;
      --brand-soft: rgba(56, 139, 253, 0.15);
      --danger-fg: #ff7b72;
      --toc-hover: #21262d;
      --toc-text: #b1bac4;
      --input-bg: #0d1117;
      --btn-bg: #161b22;
      --btn-hover: #21262d;
      --scrollbar-thumb: #6e7681;
      --scrollbar-thumb-hover: #8b949e;
      --shadow: 0 8px 20px rgba(1, 4, 9, 0.55);
      --floating-bg: rgba(22, 27, 34, 0.9);
      --floating-shadow: 0 8px 20px rgba(1, 4, 9, 0.6);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--panel);
      font-family: var(--font-sans);
    }

    .layout {
      width: 100%;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: grid;
      grid-template-columns: 284px minmax(0, 1fr);
      gap: 0;
      align-items: start;
    }

    .toc-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      max-height: 100vh;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      padding: 18px 14px 24px;
    }

    .toc-panel::-webkit-scrollbar,
    .markdown-body pre::-webkit-scrollbar,
    .table-scroll::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .toc-panel::-webkit-scrollbar-track,
    .markdown-body pre::-webkit-scrollbar-track,
    .table-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .toc-panel::-webkit-scrollbar-thumb,
    .markdown-body pre::-webkit-scrollbar-thumb,
    .table-scroll::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }

    .toc-panel::-webkit-scrollbar-thumb:hover,
    .markdown-body pre::-webkit-scrollbar-thumb:hover,
    .table-scroll::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover);
    }

    .markdown-body pre,
    .table-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    .toc-panel h2 {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .toc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 6px 14px;
    }

    .toc-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .quick-menu-button,
    .quick-menu-item {
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      background: var(--btn-bg);
      color: var(--muted);
      font: 600 12px/1 var(--font-sans);
      text-align: center;
      vertical-align: middle;
      appearance: none;
      cursor: pointer;
    }

    .quick-menu-button:hover,
    .quick-menu-item:hover {
      background: var(--btn-hover);
    }

    .quick-menu-button:focus-visible,
    .quick-menu-item:focus-visible,
    .toc-filter-clear:focus-visible,
    .code-action-btn:focus-visible,
    .mobile-toc-toggle:focus-visible,
    .sidebar-expand-fab:focus-visible,
    .back-to-top:focus-visible {
      outline: 2px solid #54aeff;
      outline-offset: 2px;
    }

    .quick-menu-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .quick-menu-item:hover {
      color: var(--brand);
      text-decoration: none;
    }

    .quick-menu-item.is-hidden {
      display: none;
    }

    .toc-filter-wrap {
      position: relative;
      margin: 0 0 14px;
    }

    .toc-filter {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 36px 0 10px;
      margin: 0;
      font-size: 13px;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
    }

    .toc-filter:focus {
      border-color: #54aeff;
      box-shadow: 0 0 0 2px rgba(84, 174, 255, 0.2);
    }

    .toc-filter-clear {
      display: none;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 4px;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font: 400 18px/1 var(--font-sans);
      cursor: pointer;
    }

    .toc-filter-wrap.has-value .toc-filter-clear {
      display: inline-flex;
    }

    .toc-filter-clear:hover {
      color: var(--text);
      background: var(--btn-hover);
    }

    .toc-filter-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      margin: -6px 2px 10px;
    }

    .toc-current {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc-filter-status {
      display: none;
      margin: -2px 2px 10px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--btn-hover);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .toc-filter-status.show {
      display: block;
    }

    .toc-filter-status.is-empty {
      border-color: rgba(207, 34, 46, 0.32);
      background: #ffebe9;
      color: #cf222e;
    }

    html[data-theme='dark'] .toc-filter-status.is-empty {
      border-color: rgba(255, 123, 114, 0.34);
      background: rgba(248, 81, 73, 0.12);
      color: #ff7b72;
    }

    #TOC ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
      border-left: 0;
    }

    #TOC ul ul {
      margin-left: 9px;
      padding-left: 9px;
      border-left: 1px solid var(--line);
    }

    #TOC li {
      margin: 2px 0;
      line-height: 1.3;
      position: relative;
    }

    #TOC a {
      display: block;
      color: var(--toc-text);
      text-decoration: none;
      word-break: break-word;
      border-radius: 6px;
      padding: 6px 8px;
      transition: color 120ms ease, background-color 120ms ease;
    }

    #TOC a:hover {
      color: var(--brand);
      background: var(--toc-hover);
      text-decoration: none;
    }

    #TOC a.active {
      color: var(--text);
      background: var(--toc-hover);
      box-shadow: inset 3px 0 0 var(--brand);
      font-weight: 600;
    }

    #TOC a.toc-filter-context-match:not(.toc-filter-direct-match) {
      color: var(--muted);
    }

    #TOC a.toc-filter-direct-match {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 700;
    }

    .toc-filter-mark {
      border-radius: 3px;
      padding: 0 1px;
      background: rgba(255, 212, 0, 0.35);
      color: inherit;
    }

    html[data-theme='dark'] .toc-filter-mark {
      background: rgba(210, 168, 255, 0.28);
    }

    #TOC li.has-children > a {
      padding-left: 20px;
    }

    #TOC .toc-toggle {
      position: absolute;
      left: 4px;
      top: 6px;
      width: 14px;
      height: 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 14px;
      text-align: center;
    }

    #TOC li > ul {
      display: none;
    }

    #TOC li.toc-hidden {
      display: none !important;
    }

    #TOC > ul {
      display: block;
    }

    #TOC li.expanded > ul {
      display: block;
    }

    #TOC li.expanded > .toc-toggle {
      transform: rotate(90deg);
    }

    .doc-panel {
      min-width: 0;
      background: var(--panel);
      border: 0;
      border-radius: 0;
      padding: 42px 56px 88px;
    }

    .markdown-body {
      background: transparent !important;
      max-width: 1120px;
      margin: 0 auto;
      color: var(--text);
      font-size: 15.5px;
      line-height: 1.75;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      line-height: 1.35;
      font-weight: 600;
      margin-top: 1.35em;
      margin-bottom: 0.55em;
      scroll-margin-top: 12px;
    }

    .markdown-body h1 { font-size: 2em; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1.06em; }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote {
      margin-top: 0;
      margin-bottom: 0.9em;
    }

    .markdown-body pre {
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--code-border);
      background: var(--code-bg);
      overflow: auto;
      line-height: 1.5;
      position: relative;
    }

    .markdown-body .code-block-shell {
      margin: 1.1em 0;
      border: 1px solid var(--code-border);
      border-radius: 8px;
      background: var(--code-bg);
      overflow: hidden;
    }

    .markdown-body .code-block-shell.code-collapsible {
      position: relative;
    }

    .markdown-body .code-block-shell > pre {
      margin: 0;
      border: 0;
      border-radius: 0;
      padding-top: 12px;
      background: transparent;
    }

    .markdown-body .code-block-shell.code-collapsed > pre {
      max-height: 420px;
      overflow: hidden;
    }

    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
    }

    .markdown-body pre > code {
      background: transparent !important;
      padding: 0;
      border: 0;
      white-space: pre;
    }

    .markdown-body pre.code-wrap-enabled > code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-body pre code {
      color: var(--text);
    }

    .markdown-body pre code span.kw,
    .markdown-body pre code span.cf,
    .markdown-body pre code span.er {
      color: #cf222e;
    }

    .markdown-body pre code span.dt,
    .markdown-body pre code span.op,
    .markdown-body pre code span.bu {
      color: var(--text);
    }

    .markdown-body pre code span.st,
    .markdown-body pre code span.vs {
      color: #0a3069;
    }

    .markdown-body pre code span.co,
    .markdown-body pre code span.do {
      color: #6e7781;
      font-style: italic;
    }

    .markdown-body pre code span.an,
    .markdown-body pre code span.at {
      color: #8250df;
    }

    .markdown-body pre code span.fu {
      color: #8250df;
    }

    .markdown-body pre code span.dv,
    .markdown-body pre code span.fl,
    .markdown-body pre code span.bn {
      color: #0550ae;
    }

    .markdown-body pre code span.va {
      color: #953800;
    }

    .markdown-body :not(pre) > code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 0.12em 0.35em;
    }

    html[data-theme='dark'] .markdown-body .code-block-shell {
      border-color: #30363d;
      background: #161b22;
    }

    html[data-theme='dark'] .markdown-body pre,
    html[data-theme='dark'] .markdown-body pre > code {
      background: #161b22;
      border-color: #30363d;
      color: #c9d1d9;
    }

    html[data-theme='dark'] .markdown-body .code-block-shell > pre,
    html[data-theme='dark'] .markdown-body .code-block-shell > pre > code {
      background: transparent;
    }

    html[data-theme='dark'] .markdown-body pre code span.kw,
    html[data-theme='dark'] .markdown-body pre code span.cf,
    html[data-theme='dark'] .markdown-body pre code span.er {
      color: #ff7b72 !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.dt,
    html[data-theme='dark'] .markdown-body pre code span.op,
    html[data-theme='dark'] .markdown-body pre code span.bu {
      color: #c9d1d9 !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.st,
    html[data-theme='dark'] .markdown-body pre code span.vs {
      color: #a5d6ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.co,
    html[data-theme='dark'] .markdown-body pre code span.do {
      color: #8b949e !important;
      font-style: italic;
    }

    html[data-theme='dark'] .markdown-body pre code span.an,
    html[data-theme='dark'] .markdown-body pre code span.at {
      color: #d2a8ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.fu {
      color: #d2a8ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.dv,
    html[data-theme='dark'] .markdown-body pre code span.fl,
    html[data-theme='dark'] .markdown-body pre code span.bn {
      color: #79c0ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.va {
      color: #ffa657 !important;
    }

    html[data-theme='dark'] .markdown-body pre code .http-method { color: #ff7b72; }
    html[data-theme='dark'] .markdown-body pre code .http-url { color: #79c0ff; }
    html[data-theme='dark'] .markdown-body pre code .http-header-key { color: #d2a8ff; }
    html[data-theme='dark'] .markdown-body pre code .http-header-val { color: #c9d1d9; }
    html[data-theme='dark'] .markdown-body pre code .http-placeholder {
      color: #9ecbff;
      background: #1f2f46;
    }

    .markdown-body pre code .http-method {
      color: #cf222e;
      font-weight: 700;
    }

    .markdown-body pre code .http-url {
      color: #0969da;
      font-weight: 600;
    }

    .markdown-body pre code .http-header-key {
      color: #6f42c1;
      font-weight: 600;
    }

    .markdown-body pre code .http-header-val {
      color: #0a3069;
    }

    .markdown-body pre code .http-placeholder {
      color: #0550ae;
      background: #ddf4ff;
      border-radius: 4px;
      padding: 0 2px;
    }

    .markdown-body table {
      display: table;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 1.1em 0;
      font-size: 14px;
      line-height: 1.45;
      table-layout: auto;
      overflow: hidden;
    }

    .markdown-body font[color='red' i],
    .markdown-body font[color='#f00' i],
    .markdown-body font[color='#ff0000' i] {
      color: var(--danger-fg) !important;
    }

    .markdown-body .table-scroll {
      position: relative;
      overflow: auto;
      margin: 1.1em 0;
      border-radius: 6px;
    }

    .markdown-body .table-scroll.is-scrollable {
      box-shadow:
        inset 14px 0 12px -16px rgba(27, 31, 35, 0.45),
        inset -14px 0 12px -16px rgba(27, 31, 35, 0.45);
    }

    .markdown-body .table-scroll.is-scrollable::after {
      content: '横向滚动';
      position: sticky;
      right: 8px;
      float: right;
      top: 6px;
      z-index: 2;
      display: inline-flex;
      margin-top: 6px;
      margin-right: 6px;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.3;
      opacity: 0.72;
      pointer-events: none;
    }

    .markdown-body .table-scroll.is-scrollable:hover::after {
      opacity: 1;
    }

    .markdown-body .table-scroll > table {
      margin: 0;
      min-width: 100%;
    }

    .markdown-body table th,
    .markdown-body table td {
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 7px 10px;
      vertical-align: top;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .markdown-body table code {
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
    }

    .markdown-body table tr > :last-child {
      border-right: 0;
    }

    .markdown-body table tbody:last-child tr:last-child > th,
    .markdown-body table tbody:last-child tr:last-child > td,
    .markdown-body table tfoot:last-child tr:last-child > th,
    .markdown-body table tfoot:last-child tr:last-child > td,
    .markdown-body table > tr:last-child > th,
    .markdown-body table > tr:last-child > td {
      border-bottom: 0;
    }

    .markdown-body table thead:last-child tr:last-child > th,
    .markdown-body table thead:last-child tr:last-child > td {
      border-bottom: 0;
    }

    .markdown-body table thead:first-child tr:first-child > :first-child,
    .markdown-body table tbody:first-child tr:first-child > :first-child,
    .markdown-body table > tr:first-child > :first-child {
      border-top-left-radius: 5px;
    }

    .markdown-body table thead:first-child tr:first-child > :last-child,
    .markdown-body table tbody:first-child tr:first-child > :last-child,
    .markdown-body table > tr:first-child > :last-child {
      border-top-right-radius: 5px;
    }

    .markdown-body table tbody:last-child tr:last-child > :first-child,
    .markdown-body table tfoot:last-child tr:last-child > :first-child,
    .markdown-body table > tr:last-child > :first-child {
      border-bottom-left-radius: 5px;
    }

    .markdown-body table tbody:last-child tr:last-child > :last-child,
    .markdown-body table tfoot:last-child tr:last-child > :last-child,
    .markdown-body table > tr:last-child > :last-child {
      border-bottom-right-radius: 5px;
    }

    .markdown-body table thead th {
      background: var(--table-head);
      color: var(--text);
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
    }

    .markdown-body table tbody tr:nth-child(even) {
      background: var(--table-zebra);
    }

    .markdown-body table tbody tr:hover {
      background: var(--btn-hover);
    }

    html[data-theme='dark'] .markdown-body table {
      color: var(--text);
      background: var(--bg);
    }

    html[data-theme='dark'] .markdown-body table th,
    html[data-theme='dark'] .markdown-body table td {
      border-color: var(--line);
      background: transparent;
      color: var(--text);
    }

    html[data-theme='dark'] .markdown-body table thead th {
      background: var(--table-head);
      color: var(--text);
    }

    html[data-theme='dark'] .markdown-body table tbody td {
      background: var(--bg);
    }

    html[data-theme='dark'] .markdown-body table tbody tr:nth-child(even) td {
      background: var(--table-zebra);
    }

    html[data-theme='dark'] .markdown-body table tbody tr:hover td {
      background: var(--btn-hover);
    }

    html[data-theme='dark'] .markdown-body .table-scroll.is-scrollable {
      box-shadow:
        inset 14px 0 12px -16px rgba(201, 209, 217, 0.65),
        inset -14px 0 12px -16px rgba(201, 209, 217, 0.65);
    }

    .code-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 5px 8px;
      border-bottom: 1px solid var(--code-border);
      background: var(--panel);
    }

    html[data-theme='dark'] .code-actions {
      border-bottom-color: #30363d;
      background: #0d1117;
    }

    .code-action-btn {
      height: 22px;
      min-width: 56px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1;
      padding: 0 8px;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .code-lang-badge {
      display: none;
      align-items: center;
      justify-content: center;
      height: 22px;
      min-width: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 7px;
      background: var(--btn-hover);
      color: var(--muted);
      font: 700 11px/1 var(--font-sans);
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    .code-lang-badge.show {
      display: inline-flex;
      margin-right: auto;
    }

    .code-wrap-btn {
      min-width: 48px;
    }

    .code-collapse-bar {
      display: none;
      justify-content: center;
      position: relative;
      padding: 7px 8px;
      border-top: 1px solid var(--code-border);
      background: var(--panel);
    }

    .code-collapsible .code-collapse-bar {
      display: flex;
    }

    .code-collapsed .code-collapse-bar::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -56px;
      height: 56px;
      background: linear-gradient(to bottom, var(--code-bg-transparent), var(--code-bg) 76%);
      pointer-events: none;
    }

    html[data-theme='dark'] .code-collapse-bar {
      border-top-color: #30363d;
      background: #0d1117;
    }

    .code-collapse-btn {
      min-width: 112px;
      position: relative;
      z-index: 1;
    }

    .code-action-btn:hover {
      background: var(--btn-hover);
    }

    .quick-menu {
      position: relative;
      display: inline-flex;
      z-index: 20;
    }

    .quick-menu-panel {
      display: none;
      position: absolute;
      top: 32px;
      right: 0;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .quick-menu.open .quick-menu-panel {
      display: flex;
    }

    .quick-menu-toggle {
      min-width: 74px;
      font-weight: 600;
    }

    .sidebar-toggle {
      min-width: 48px;
      font-weight: 600;
    }

    .sidebar-expand-fab {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 60;
      height: 30px;
      min-width: 56px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: var(--floating-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--floating-shadow);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    html.sidebar-collapsed .sidebar-expand-fab,
    body.sidebar-collapsed .sidebar-expand-fab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .back-to-top {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--floating-bg);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      box-shadow: var(--floating-shadow);
      backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 120ms ease, background-color 120ms ease, transform 120ms ease;
    }

    .mobile-toc-toggle,
    .mobile-toc-backdrop {
      display: none;
    }

    .back-to-top.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .back-to-top:hover,
    .back-to-top:focus-visible,
    .sidebar-expand-fab:hover,
    .mobile-toc-toggle:hover {
      background: var(--btn-hover);
    }

    .back-to-top:hover,
    .back-to-top:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
        display: block;
      }

      .toc-panel {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 80;
        width: min(86vw, 360px);
        height: 100vh;
        max-height: 100vh;
        overflow: auto;
        overscroll-behavior: contain;
        border-right: 1px solid var(--line);
        border-bottom: 0;
        box-shadow: var(--shadow);
        transform: translateX(-104%);
        transition: transform 160ms ease;
      }

      html.sidebar-collapsed .toc-panel,
      body.sidebar-collapsed .toc-panel {
        display: block;
      }

      body.mobile-toc-open .toc-panel {
        transform: translateX(0);
      }

      body.mobile-toc-open {
        overflow: hidden;
      }

      .mobile-toc-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 70;
        height: 34px;
        min-width: 60px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--floating-bg);
        color: var(--text);
        box-shadow: var(--floating-shadow);
        backdrop-filter: blur(8px);
        font: 700 13px/1 var(--font-sans);
        cursor: pointer;
        transition: opacity 140ms ease, transform 140ms ease, background-color 120ms ease;
      }

      body.mobile-toc-open .mobile-toc-toggle {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-6px);
      }

      .mobile-toc-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(1, 4, 9, 0.46);
      }

      body.mobile-toc-open .mobile-toc-backdrop {
        display: block;
      }

      .sidebar-expand-fab {
        display: none !important;
      }

      .doc-panel {
        padding: 58px 20px 72px;
      }

      .back-to-top {
        right: 12px;
        bottom: 12px;
        width: 40px;
        height: 40px;
      }

    }

    @media (max-width: 560px) {
      .doc-panel {
        padding-left: 16px;
        padding-right: 16px;
      }

      .markdown-body {
        font-size: 15px;
      }

      .code-actions {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .code-action-btn,
      .code-lang-badge {
        height: 28px;
      }

      .back-to-top {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }
    }
  </style>

  $header-includes$
  $endfor$

<body>
  <div class="layout">
    $if(toc)$
    <aside class="toc-panel">
      <nav id="$idprefix$TOC" role="doc-toc">
        <div class="toc-head">
          <h2>目录</h2>
          <div class="toc-actions">
            <button id="sidebar-toggle" class="quick-menu-button sidebar-toggle" type="button" aria-label="收起侧边栏">收起</button>
            <div id="quick-menu" class="quick-menu">
              <button id="quick-menu-toggle" class="quick-menu-button quick-menu-toggle" type="button" aria-label="打开页面操作">操作</button>
              <div id="quick-menu-panel" class="quick-menu-panel" aria-label="页面操作">
                <button id="source-md-link" class="quick-menu-item is-hidden" type="button" aria-label="下载源文档">下载</button>
                <button id="quick-theme" class="quick-menu-item" type="button" aria-label="切换主题">深色</button>
              </div>
            </div>
          </div>
        </div>
        <div id="toc-filter-wrap" class="toc-filter-wrap">
          <input id="toc-filter" class="toc-filter" type="text" placeholder="搜索目录 / 接口标题..." aria-label="搜索目录" />
          <button id="toc-filter-clear" class="toc-filter-clear" type="button" aria-label="清除目录搜索" title="清除搜索">&times;</button>
        </div>
        <div class="toc-filter-tools">
          <div id="toc-current" class="toc-current">当前：-</div>
        </div>
        <div id="toc-filter-status" class="toc-filter-status" aria-live="polite"></div>
        $table-of-contents$
      </nav>
    </aside>
    $endif$
    <main class="doc-panel">
      <article class="markdown-body">
        $body$
      </article>
    </main>
  </div>
  $if(toc)$
  <button id="sidebar-expand-fab" class="sidebar-expand-fab" type="button" aria-label="展开侧边栏">展开</button>
  <button id="mobile-toc-toggle" class="mobile-toc-toggle" type="button" aria-label="打开目录">目录</button>
  <div id="mobile-toc-backdrop" class="mobile-toc-backdrop" aria-hidden="true"></div>
  $endif$
  <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部">&uarr;</button>
  <script id="pinyin-match-js">
__PINYIN_MATCH_INLINE__
  </script>
  <noscript>
    <style>
      #TOC li > ul {
        display: block !important;
      }
    </style>
  </noscript>
  <script id="docs-runtime-js">
    (function () {
      var root = document.documentElement;
      var body = document.body;
      var markdownBody = document.querySelector('.markdown-body');
      var sidebarInitReady = false;
      var sourceMdLink = document.getElementById('source-md-link');
      function markSidebarInitReady() {
        if (sidebarInitReady) return;
        root.classList.remove('sidebar-init-pending');
        root.classList.add('sidebar-init-ready');
        sidebarInitReady = true;
      }

      function setupSourceMarkdownLink() {
        var pathname = window.location && window.location.pathname ? window.location.pathname : '';
        var lowerPath = pathname.toLowerCase();
        var suffixLength = lowerPath.slice(-5) === '.html' ? 5 : (lowerPath.slice(-4) === '.htm' ? 4 : 0);
        if (!suffixLength) return;

        var mdPath = pathname.slice(0, pathname.length - suffixLength) + '.md';
        var filename = decodeURIComponent(mdPath.split('/').pop() || 'source.md');

        if (!sourceMdLink) return;
        sourceMdLink.setAttribute('data-href', mdPath);
        sourceMdLink.setAttribute('data-filename', filename);
        sourceMdLink.setAttribute('title', '下载 ' + filename);
        sourceMdLink.classList.remove('is-hidden');
        sourceMdLink.classList.add('show');
      }

      setupSourceMarkdownLink();

      var links = Array.prototype.slice.call(document.querySelectorAll('#TOC a[href^="#"]'));
      var map = links
        .map(function (a) {
          var id = decodeURIComponent((a.getAttribute('href') || '').slice(1));
          return { link: a, target: document.getElementById(id) };
        })
        .filter(function (x) { return x.target; });
      var currentActiveLink = null;

      function setActive(link) {
        if (link === currentActiveLink) {
          if (link && !link.classList.contains('active')) link.classList.add('active');
          return;
        }
        if (currentActiveLink) currentActiveLink.classList.remove('active');
        currentActiveLink = link || null;
        if (currentActiveLink) currentActiveLink.classList.add('active');
      }

      function directChild(el, tag) {
        var children = el.children || [];
        for (var i = 0; i < children.length; i++) {
          if ((children[i].tagName || '').toLowerCase() === tag) return children[i];
        }
        return null;
      }

      function getPinyinMatchRange(text, keyword) {
        var pm = window.PinyinMatch;
        if (!pm || !pm.match) return null;
        try {
          var hit = pm.match(text, keyword);
          if (!hit) return null;
          if (Array.isArray(hit) && hit.length >= 2 && typeof hit[0] === 'number' && typeof hit[1] === 'number') {
            return [hit[0], hit[1] + 1];
          }
          if (Array.isArray(hit[0]) && hit[0].length >= 2) {
            return [hit[0][0], hit[0][1] + 1];
          }
          return [0, 0];
        } catch (e) {
          return null;
        }
      }

      function getHeadingMatchInfo(text, keyword) {
        var raw = text || '';
        var t = raw.toLowerCase();
        var q = (keyword || '').toLowerCase();
        var idx;
        if (!q) return { matched: true, range: null };

        idx = t.indexOf(q);
        if (idx !== -1) return { matched: true, range: [idx, idx + q.length] };

        var range = getPinyinMatchRange(raw, keyword);
        if (range) return { matched: true, range: range };
        return { matched: false, range: null };
      }

      function normalizeExactTitle(text) {
        return (text || '').replace(/\s+/g, '').toLowerCase();
      }

      var tocRoot = document.getElementById('TOC');
      var filterInput = document.getElementById('toc-filter');
      var filterWrap = document.getElementById('toc-filter-wrap');
      var filterClear = document.getElementById('toc-filter-clear');
      var filterStatus = document.getElementById('toc-filter-status');
      var currentSection = document.getElementById('toc-current');
      var quickMenu = document.getElementById('quick-menu');
      var quickMenuToggle = document.getElementById('quick-menu-toggle');
      var quickTheme = document.getElementById('quick-theme');
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var sidebarExpandFab = document.getElementById('sidebar-expand-fab');
      var mobileTocToggle = document.getElementById('mobile-toc-toggle');
      var mobileTocBackdrop = document.getElementById('mobile-toc-backdrop');
      var backToTop = document.getElementById('back-to-top');
      var tocFilterActive = false;
      var tocSaveTimer = null;
      var tocLiByHref = Object.create(null);
      var tocStateKey = 'doc-toc-expanded:' + (window.location && window.location.pathname ? window.location.pathname : '');
      var codeWrapKey = 'doc-code-wrap';
      var codeWrapEnabled = false;
      var sectionIndex = [];
      var sectionIndexReady = false;
      var headingOffsets = [];
      var codeBlocks = [];
      var tableScrollWrappers = [];
      var currentSectionItem = null;
      var backToTopShown = false;
      var scrollSpyScheduled = false;
      var resizeScheduled = false;
      var filterTimer = null;
      var prefersDark = false;
      try {
        prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {
        prefersDark = false;
      }

      var storedTheme = '';
      try { storedTheme = localStorage.getItem('doc-theme') || ''; } catch (e) { storedTheme = ''; }
      if (storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark)) {
        root.setAttribute('data-theme', 'dark');
      }

      try { codeWrapEnabled = localStorage.getItem(codeWrapKey) === 'wrap'; } catch (e) { codeWrapEnabled = false; }

      if (root.classList.contains('sidebar-collapsed')) {
        body.classList.add('sidebar-collapsed');
      } else {
        body.classList.remove('sidebar-collapsed');
      }

      function isMobileLayout() {
        try {
          return window.matchMedia && window.matchMedia('(max-width: 960px)').matches;
        } catch (e) {
          return false;
        }
      }

      function setMobileTocOpen(open) {
        body.classList.toggle('mobile-toc-open', !!open);
        if (mobileTocToggle) {
          mobileTocToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          mobileTocToggle.setAttribute('aria-label', open ? '关闭目录' : '打开目录');
        }
      }

      function refreshSidebarLabel() {
        if (!sidebarToggle) return;
        if (isMobileLayout()) {
          sidebarToggle.textContent = '收起';
          sidebarToggle.setAttribute('aria-label', '收起目录');
          return;
        }
        var collapsed = body.classList.contains('sidebar-collapsed');
        sidebarToggle.textContent = collapsed ? '展开' : '收起';
        sidebarToggle.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
      }

      function setSidebarCollapsed(collapsed) {
        if (isMobileLayout()) {
          setMobileTocOpen(false);
          return;
        }
        if (collapsed) {
          root.classList.add('sidebar-collapsed');
          body.classList.add('sidebar-collapsed');
        } else {
          root.classList.remove('sidebar-collapsed');
          body.classList.remove('sidebar-collapsed');
        }
        try { localStorage.setItem('doc-sidebar', collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
        refreshSidebarLabel();
      }

      function clearAllTocExpanded() {
        if (!tocRoot) return;
        Array.prototype.slice.call(tocRoot.querySelectorAll('li.expanded')).forEach(function (li) {
          li.classList.remove('expanded');
        });
      }

      function loadTocExpandedState() {
        var raw = '';
        try {
          raw = localStorage.getItem(tocStateKey) || '[]';
        } catch (e) {
          return [];
        }

        try {
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(function (x) { return typeof x === 'string' && x.charAt(0) === '#'; });
        } catch (e) {
          return [];
        }
      }

      function applyTocExpandedState(ids) {
        if (!tocRoot) return;
        clearAllTocExpanded();
        ids.forEach(function (href) {
          var li = tocLiByHref[href];
          if (li) li.classList.add('expanded');
        });
      }

      function collectTocExpandedState() {
        if (!tocRoot) return [];
        var hrefs = [];
        Array.prototype.slice.call(tocRoot.querySelectorAll('li.expanded')).forEach(function (li) {
          var a = directChild(li, 'a');
          if (!a) return;
          var href = (a.getAttribute('href') || '').trim();
          if (!href || href.charAt(0) !== '#') return;
          hrefs.push(href);
        });
        return hrefs;
      }

      function saveTocExpandedStateNow() {
        if (!tocRoot || tocFilterActive) return;
        try {
          localStorage.setItem(tocStateKey, JSON.stringify(collectTocExpandedState()));
        } catch (e) {}
      }

      function scheduleSaveTocExpandedState() {
        if (!tocRoot || tocFilterActive) return;
        if (tocSaveTimer) clearTimeout(tocSaveTimer);
        tocSaveTimer = setTimeout(function () {
          saveTocExpandedStateNow();
        }, 120);
      }

      function refreshThemeLabel() {
        if (!quickTheme) return;
        quickTheme.textContent = root.getAttribute('data-theme') === 'dark' ? '浅色' : '深色';
      }
      refreshThemeLabel();
      refreshSidebarLabel();

      if (quickTheme) {
        quickTheme.addEventListener('click', function () {
          var dark = root.getAttribute('data-theme') === 'dark';
          if (dark) root.removeAttribute('data-theme');
          else root.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('doc-theme', dark ? 'light' : 'dark'); } catch (e) {}
          refreshThemeLabel();
          closeQuickMenu();
        });
      }

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          setSidebarCollapsed(!body.classList.contains('sidebar-collapsed'));
          closeQuickMenu();
        });
      }

      if (sidebarExpandFab) {
        sidebarExpandFab.addEventListener('click', function () {
          setSidebarCollapsed(false);
        });
      }

      if (mobileTocToggle) {
        mobileTocToggle.addEventListener('click', function () {
          setMobileTocOpen(!body.classList.contains('mobile-toc-open'));
        });
      }

      if (mobileTocBackdrop) {
        mobileTocBackdrop.addEventListener('click', function () {
          setMobileTocOpen(false);
        });
      }

      function updateBackToTop() {
        if (!backToTop) return;
        var shouldShow = window.scrollY > 600;
        if (shouldShow === backToTopShown) return;
        backToTopShown = shouldShow;
        backToTop.classList.toggle('show', shouldShow);
      }

      if (backToTop) {
        backToTop.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        updateBackToTop();
      }

      if (sourceMdLink) {
        sourceMdLink.addEventListener('click', function () {
          var href = sourceMdLink.getAttribute('data-href') || '';
          if (href) {
            var a = document.createElement('a');
            a.href = href;
            a.download = sourceMdLink.getAttribute('data-filename') || 'source.md';
            document.body.appendChild(a);
            a.click();
            a.remove();
          }
          closeQuickMenu();
        });
      }

      function closeQuickMenu() {
        if (quickMenu) quickMenu.classList.remove('open');
      }

      if (quickMenu && quickMenuToggle) {
        quickMenuToggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          quickMenu.classList.toggle('open');
        });

        quickMenu.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        document.addEventListener('click', closeQuickMenu);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            closeQuickMenu();
            setMobileTocOpen(false);
          }
        });
      }

      if (tocRoot) {
        Array.prototype.slice.call(tocRoot.querySelectorAll('a[href^="#"]')).forEach(function (a) {
          var tocLabel = (a.textContent || '').replace(/\s+/g, ' ').trim();
          a.setAttribute('data-toc-label', tocLabel);
          a.setAttribute('title', tocLabel);
          var href = (a.getAttribute('href') || '').trim();
          var li = a.closest ? a.closest('li') : null;
          if (href && href.charAt(0) === '#' && li && !tocLiByHref[href]) {
            tocLiByHref[href] = li;
          }
        });

        var lis = Array.prototype.slice.call(tocRoot.querySelectorAll('li'));
        lis.forEach(function (li) {
          var child = directChild(li, 'ul');
          var anchor = directChild(li, 'a');
          if (!child || !anchor) return;

          li.classList.add('has-children');

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toc-toggle';
          btn.setAttribute('aria-label', '展开或收起子目录');
          btn.textContent = '>';
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            li.classList.toggle('expanded');
            scheduleSaveTocExpandedState();
          });

          li.insertBefore(btn, anchor);
        });

        applyTocExpandedState(loadTocExpandedState());
      }

      function buildSectionSearchIndex() {
        sectionIndex = map.map(function (item) {
          var href = item.link.getAttribute('href') || '';
          var li = tocLiByHref[href] || (item.link.closest ? item.link.closest('li') : null);
          var label = item.link.getAttribute('data-toc-label') || item.link.textContent || '';
          return {
            link: item.link,
            target: item.target,
            li: li,
            label: label
          };
        }).filter(function (x) {
          return !!x.li;
        });
        sectionIndexReady = true;
      }

      function ensureSectionSearchIndex() {
        if (!sectionIndexReady) buildSectionSearchIndex();
      }

      function showNodeWithContext(li, expandSelf) {
        var n = li;
        var direct = true;
        while (n && n.tagName && n.tagName.toLowerCase() === 'li') {
          n.classList.remove('toc-hidden');
          if (!direct || expandSelf) {
            n.classList.add('expanded');
          }
          if (!direct) {
            var a = directChild(n, 'a');
            if (a) a.classList.add('toc-filter-context-match');
          }
          direct = false;
          n = n.parentElement ? n.parentElement.closest('li') : null;
        }
      }

      function showDescendantNodes(li) {
        var childItems = li ? li.querySelectorAll('li') : [];
        Array.prototype.slice.call(childItems).forEach(function (child) {
          child.classList.remove('toc-hidden');
          child.classList.add('expanded');
        });
      }

      function resetTocFilterDecorations(items) {
        items.forEach(function (li) {
          var a = directChild(li, 'a');
          if (!a) return;
          a.classList.remove('toc-filter-direct-match');
          a.classList.remove('toc-filter-context-match');
          a.textContent = a.getAttribute('data-toc-label') || a.textContent || '';
        });
      }

      function updateFilterStatus(keyword, titleCount, expandedSubmenus) {
        if (!filterStatus) return;
        var q = (keyword || '').trim();
        if (!q) {
          filterStatus.textContent = '';
          filterStatus.classList.remove('show');
          filterStatus.classList.remove('is-empty');
          return;
        }

        filterStatus.classList.add('show');
        filterStatus.classList.toggle('is-empty', titleCount === 0);
        if (titleCount === 0) {
          filterStatus.textContent = '无匹配';
        } else if (expandedSubmenus) {
          filterStatus.textContent = '已展开 ' + titleCount + ' 个相关目录';
        } else {
          filterStatus.textContent = '命中 ' + titleCount + ' 个目录';
        }
      }

      function highlightTocMatch(anchor, range) {
        var raw = anchor.getAttribute('data-toc-label') || anchor.textContent || '';
        var start = range && typeof range[0] === 'number' ? Math.max(0, range[0]) : -1;
        var end = range && typeof range[1] === 'number' ? Math.min(raw.length, range[1]) : -1;

        anchor.classList.add('toc-filter-direct-match');
        if (start < 0 || end <= start) {
          anchor.textContent = raw;
          return;
        }

        anchor.innerHTML =
          escapeHtml(raw.slice(0, start)) +
          '<mark class="toc-filter-mark">' + escapeHtml(raw.slice(start, end)) + '</mark>' +
          escapeHtml(raw.slice(end));
      }

      function applyFilter(keyword) {
        if (!tocRoot) return;
        var q = (keyword || '').trim();
        var items = Array.prototype.slice.call(tocRoot.querySelectorAll('li'));
        resetTocFilterDecorations(items);

        if (!q) {
          tocFilterActive = false;
          items.forEach(function (li) {
            li.classList.remove('toc-hidden');
          });
          updateFilterStatus(q, 0, 0);
          applyTocExpandedState(loadTocExpandedState());
          return;
        }

        ensureSectionSearchIndex();
        tocFilterActive = true;
        var titleCount = 0;
        var titleMatches = [];
        items.forEach(function (li) {
          li.classList.add('toc-hidden');
          li.classList.remove('expanded');
        });

        sectionIndex.forEach(function (entry) {
          var info = getHeadingMatchInfo(entry.label, q);
          if (!info.matched) return;
          titleMatches.push({ entry: entry, info: info });
        });

        var exactQ = normalizeExactTitle(q);
        var exactMatches = titleMatches.filter(function (match) {
          return normalizeExactTitle(match.entry.label) === exactQ;
        });
        if (exactMatches.length > 0) {
          titleMatches = exactMatches;
        }
        var shouldExpandSubmenus = exactMatches.length > 0;

        if (titleMatches.length > 0) {
          titleMatches.forEach(function (match) {
            titleCount++;
            highlightTocMatch(match.entry.link, match.info.range);
            showNodeWithContext(match.entry.li, shouldExpandSubmenus);
            if (shouldExpandSubmenus) {
              showDescendantNodes(match.entry.li);
            }
          });
        }

        updateFilterStatus(q, titleCount, shouldExpandSubmenus);
      }

      function syncFilterClearButton() {
        if (!filterInput || !filterWrap) return;
        filterWrap.classList.toggle('has-value', filterInput.value.length > 0);
      }

      function clearTocFilter() {
        if (!filterInput) return;
        if (filterTimer) {
          clearTimeout(filterTimer);
          filterTimer = null;
        }
        filterInput.value = '';
        syncFilterClearButton();
        applyFilter('');
        filterInput.focus();
      }

      function updateCurrentSection(item) {
        if (!item) return;
        var label = item.link.getAttribute('data-toc-label') || item.link.textContent || '';
        setActive(item.link);
        if (item === currentSectionItem) return;
        currentSectionItem = item;
        if (currentSection) {
          currentSection.textContent = '当前：' + label;
          currentSection.setAttribute('title', label);
        }
      }

      function refreshCurrentSection() {
        if (!map.length) return;
        if (!headingOffsets.length) rebuildHeadingOffsets();
        var current = map[0];
        var anchorY = window.scrollY + 80;
        var lo = 0;
        var hi = headingOffsets.length - 1;
        var best = -1;
        while (lo <= hi) {
          var mid = (lo + hi) >> 1;
          if (headingOffsets[mid].top <= anchorY) {
            best = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        if (best >= 0) current = headingOffsets[best].item;
        updateCurrentSection(current);
      }

      function rebuildHeadingOffsets() {
        headingOffsets = map.map(function (item) {
          return {
            item: item,
            top: item.target.getBoundingClientRect().top + window.scrollY
          };
        });
      }

      function refreshScrollState() {
        updateBackToTop();
        refreshCurrentSection();
      }

      function scheduleCurrentSectionRefresh() {
        if (scrollSpyScheduled) return;
        scrollSpyScheduled = true;
        window.setTimeout(function () {
          window.requestAnimationFrame(function () {
            scrollSpyScheduled = false;
            refreshScrollState();
          });
        }, 80);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function markPlaceholders(s) {
        return s.replace(/\{\{[^}]+\}\}/g, function (m) {
          return '<span class="http-placeholder">' + m + '</span>';
        });
      }

      function formatHttpSnippets() {
        var blocks = Array.prototype.slice.call(document.querySelectorAll('.markdown-body pre > code'));
        blocks.forEach(function (code) {
          var pre = code.parentElement;
          if (!pre) return;

          var cls = code.className || '';
          var isHttpLang = /\blanguage-http\b/i.test(cls) || /\blanguage-https\b/i.test(cls);
          if (cls.indexOf('language-') >= 0 && !isHttpLang) return;

          var text = code.textContent || '';
          var lines = text.replace(/\r\n/g, '\n').split('\n');
          if (!lines.length) return;

          var first = (lines[0] || '').trim();
          if (!/^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s+/i.test(first)) return;

          pre.classList.add('http-snippet');
          var html = [];
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (i === 0) {
              var m = line.match(/^([A-Z]+)\s+(\S+)(.*)/i);
              if (m) {
                html.push(
                  '<span class="http-method">' + escapeHtml(m[1].toUpperCase()) + '</span> ' +
                  '<span class="http-url">' + markPlaceholders(escapeHtml(m[2])) + '</span>' +
                  escapeHtml(m[3] || '')
                );
                continue;
              }
            }

            var h = line.match(/^([A-Za-z0-9\-]+)\s*:\s*(.*)/);
            if (h) {
              html.push(
                '<span class="http-header-key">' + escapeHtml(h[1]) + '</span>: ' +
                '<span class="http-header-val">' + markPlaceholders(escapeHtml(h[2])) + '</span>'
              );
            } else {
              html.push(markPlaceholders(escapeHtml(line)));
            }
          }

          code.innerHTML = html.join('\n');
        });
      }

      function setupTableScrollHints() {
        var tables = Array.prototype.slice.call(document.querySelectorAll('.markdown-body table'));
        tables.forEach(function (table) {
          var columnCount = 0;
          Array.prototype.slice.call(table.querySelectorAll('tr')).slice(0, 5).forEach(function (row) {
            columnCount = Math.max(columnCount, row.children ? row.children.length : 0);
          });
          if (columnCount >= 4) {
            table.style.minWidth = Math.max(560, columnCount * 140) + 'px';
          }

          if (table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
          var wrapper = document.createElement('div');
          wrapper.className = 'table-scroll';
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
        tableScrollWrappers = Array.prototype.slice.call(document.querySelectorAll('.markdown-body .table-scroll'));
        refreshTableScrollHints();
      }

      function refreshTableScrollHints() {
        tableScrollWrappers.forEach(function (wrapper) {
          wrapper.classList.toggle('is-scrollable', wrapper.scrollWidth > wrapper.clientWidth + 2);
        });
      }

      function getCodeLanguage(pre, code) {
        var cls = code.className || '';
        var text = code.textContent || '';
        if (pre.classList.contains('http-snippet') || /^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s+/i.test((text.split(/\r?\n/)[0] || '').trim())) return 'HTTP';

        var m = cls.match(/\blanguage-([a-z0-9_+-]+)/i);
        if (m) return m[1].toUpperCase();

        var classParts = cls.split(/\s+/);
        var knownLangs = {
          java: 'JAVA', json: 'JSON', http: 'HTTP', https: 'HTTP', sql: 'SQL',
          bash: 'BASH', sh: 'BASH', javascript: 'JS', js: 'JS',
          typescript: 'TS', ts: 'TS', xml: 'XML', yaml: 'YAML',
          yml: 'YAML', properties: 'PROPERTIES'
        };
        for (var i = 0; i < classParts.length; i++) {
          var lang = knownLangs[classParts[i].toLowerCase()];
          if (!lang) continue;
          if (lang === 'HTTPS') return 'HTTP';
          if (lang === 'SH') return 'BASH';
          if (lang === 'JS') return 'JS';
          if (lang === 'TS') return 'TS';
          if (lang === 'YML') return 'YAML';
          return lang;
        }

        if (/^\s*[\{\[]/.test(text)) return 'JSON';
        if (/\bpublic\s+class\b|\bprivate\s+\w+\b|\bimplements\b/.test(text)) return 'JAVA';
        return '';
      }

      function applyCodeWrapState() {
        codeBlocks.forEach(function (pre) {
          pre.classList.toggle('code-wrap-enabled', codeWrapEnabled);
        });

        Array.prototype.slice.call(document.querySelectorAll('.code-wrap-btn')).forEach(function (btn) {
          btn.textContent = codeWrapEnabled ? '不换行' : '换行';
          btn.setAttribute('aria-pressed', codeWrapEnabled ? 'true' : 'false');
          btn.setAttribute('aria-label', codeWrapEnabled ? '关闭代码自动换行' : '开启代码自动换行');
        });
      }

      function toggleCodeWrap() {
        codeWrapEnabled = !codeWrapEnabled;
        try { localStorage.setItem(codeWrapKey, codeWrapEnabled ? 'wrap' : 'nowrap'); } catch (e) {}
        applyCodeWrapState();
      }

      function isLongCodeBlock(text) {
        var normalized = (text || '').replace(/\r\n/g, '\n');
        var lines = normalized.split('\n');
        var contentLines = lines.filter(function (line) { return line.trim() !== ''; }).length;
        return contentLines > 36 || normalized.length > 2600;
      }

      function setCodeCollapsed(shell, collapsed) {
        var btn = shell.querySelector('.code-collapse-btn');
        shell.classList.toggle('code-collapsed', collapsed);
        shell.classList.toggle('code-expanded', !collapsed);
        if (!btn) return;
        btn.textContent = collapsed ? '展开完整代码' : '收起代码';
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.setAttribute('aria-label', collapsed ? '展开完整代码' : '收起代码');
      }

      function setupCopyButtons() {
        function fallbackCopyText(text) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try {
            ok = document.execCommand('copy');
          } catch (e) {
            ok = false;
          }
          document.body.removeChild(ta);
          return ok;
        }

        codeBlocks = Array.prototype.slice.call(document.querySelectorAll('.markdown-body pre'));
        codeBlocks.forEach(function (pre) {
          var code = pre.querySelector('code');
          if (!code) return;

          var shell = document.createElement('div');
          shell.className = 'code-block-shell';
          if (pre.classList.contains('http-snippet')) shell.classList.add('http-snippet-shell');
          pre.parentNode.insertBefore(shell, pre);

          var actions = document.createElement('div');
          actions.className = 'code-actions';

          var lang = getCodeLanguage(pre, code);
          var langBadge = document.createElement('span');
          langBadge.className = lang ? 'code-lang-badge show' : 'code-lang-badge';
          langBadge.textContent = lang;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'code-action-btn code-copy-btn';
          btn.textContent = '复制';
          btn.setAttribute('aria-label', '复制代码');

          var wrapBtn = document.createElement('button');
          wrapBtn.type = 'button';
          wrapBtn.className = 'code-action-btn code-wrap-btn';

          actions.appendChild(langBadge);
          actions.appendChild(btn);
          actions.appendChild(wrapBtn);
          shell.appendChild(actions);
          shell.appendChild(pre);

          if (isLongCodeBlock(code.textContent || '')) {
            var collapseBar = document.createElement('div');
            collapseBar.className = 'code-collapse-bar';

            var collapseBtn = document.createElement('button');
            collapseBtn.type = 'button';
            collapseBtn.className = 'code-action-btn code-collapse-btn';

            collapseBar.appendChild(collapseBtn);
            shell.appendChild(collapseBar);
            shell.classList.add('code-collapsible');
            setCodeCollapsed(shell, true);
          }
        });

        if (markdownBody) {
          markdownBody.addEventListener('click', function (e) {
            var target = e.target;
            if (!target || !target.classList) return;

            if (target.classList.contains('code-wrap-btn')) {
              e.preventDefault();
              e.stopPropagation();
              toggleCodeWrap();
              return;
            }

            if (target.classList.contains('code-collapse-btn')) {
              e.preventDefault();
              e.stopPropagation();
              var collapseShell = target.closest ? target.closest('.code-block-shell') : null;
              if (!collapseShell) return;
              var shouldCollapse = !collapseShell.classList.contains('code-collapsed');
              setCodeCollapsed(collapseShell, shouldCollapse);
              if (shouldCollapse) {
                var shellTop = collapseShell.getBoundingClientRect().top + window.pageYOffset;
                window.scrollTo({ top: Math.max(shellTop - 16, 0), behavior: 'auto' });
              }
              return;
            }

            if (!target.classList.contains('code-copy-btn')) return;
            e.preventDefault();
            e.stopPropagation();

            var shell = target.closest ? target.closest('.code-block-shell') : null;
            var pre = shell ? shell.querySelector('pre') : (target.closest ? target.closest('pre') : null);
            var code = pre ? pre.querySelector('code') : null;
            if (!code) return;

            var raw = code.textContent || '';
            var resetLabel = function () {
              target.textContent = '复制';
            };

            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
              navigator.clipboard.writeText(raw).then(function () {
                target.textContent = '已复制';
                setTimeout(resetLabel, 1200);
              }).catch(function () {
                var ok = fallbackCopyText(raw);
                target.textContent = ok ? '已复制' : 'Ctrl+C';
                setTimeout(resetLabel, 1200);
              });
            } else {
              var ok2 = fallbackCopyText(raw);
              target.textContent = ok2 ? '已复制' : 'Ctrl+C';
              setTimeout(resetLabel, 1200);
            }
          });
        }

        applyCodeWrapState();
      }

      function scheduleLayoutRefresh() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        window.requestAnimationFrame(function () {
          resizeScheduled = false;
          refreshSidebarLabel();
          if (!isMobileLayout()) setMobileTocOpen(false);
          refreshTableScrollHints();
          rebuildHeadingOffsets();
          scheduleCurrentSectionRefresh();
        });
      }

      links.forEach(function (a) {
        a.addEventListener('click', function () {
          setActive(a);
          if (isMobileLayout()) setMobileTocOpen(false);
        });
      });

      if (filterInput) {
        syncFilterClearButton();
        filterInput.addEventListener('input', function () {
          syncFilterClearButton();
          if (filterTimer) clearTimeout(filterTimer);
          filterTimer = setTimeout(function () {
            applyFilter(filterInput.value);
          }, 100);
        });
        filterInput.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && filterInput.value) {
            e.preventDefault();
            clearTocFilter();
          }
        });
      }

      if (filterClear) {
        filterClear.addEventListener('click', function () {
          clearTocFilter();
        });
      }

      if (map.length) {
        updateCurrentSection(map[0]);
      }
      formatHttpSnippets();
      setupTableScrollHints();
      setupCopyButtons();
      rebuildHeadingOffsets();
      window.addEventListener('scroll', scheduleCurrentSectionRefresh, { passive: true });
      window.addEventListener('resize', scheduleLayoutRefresh, { passive: true });
      refreshScrollState();
      markSidebarInitReady();
    })();
  </script>
</body>
</html>
