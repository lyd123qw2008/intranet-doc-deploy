<!DOCTYPE html>
<html$if(lang)$ lang="$lang$"$endif$>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$if(title-prefix)$$title-prefix$ - $endif$$pagetitle$</title>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('sidebar-init-pending');
      try {
        var storedSidebar = localStorage.getItem('doc-sidebar') || '';
        if (storedSidebar === 'collapsed') {
          root.classList.add('sidebar-collapsed');
        } else {
          root.classList.remove('sidebar-collapsed');
        }
      } catch (e) {
        root.classList.remove('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    /* Critical sidebar/layout CSS */
    .layout {
      width: 100%;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: grid;
      grid-template-columns: 284px minmax(0, 1fr);
      gap: 0;
      align-items: start;
    }

    html.sidebar-init-pending .layout {
      opacity: 0;
    }

    html.sidebar-init-ready .layout {
      opacity: 1;
      transition: opacity 90ms ease-out;
    }

    .toc-panel {
      display: block;
    }

    html.sidebar-collapsed .layout,
    body.sidebar-collapsed .layout {
      grid-template-columns: 1fr;
      gap: 0;
      padding-left: 0;
    }

    html.sidebar-collapsed .toc-panel,
    body.sidebar-collapsed .toc-panel {
      display: none;
    }

  </style>
  <style>
__GITHUB_MARKDOWN_CSS_INLINE__
  </style>
  $if(highlighting-css)$
  <style>
$highlighting-css$
  </style>
  $endif$
  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --sidebar-bg: #f7f7f8;
      --line: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --code-bg: #f6f8fa;
      --code-border: #d8dee4;
      --table-head: #f6f8fa;
      --table-zebra: #fcfcfd;
      --brand: #0969da;
      --brand-soft: #ddf4ff;
      --toc-hover: #f3f4f6;
      --toc-text: #4b5563;
      --input-bg: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover: #f3f4f6;
      --shadow: 0 6px 16px rgba(27, 31, 35, 0.12);
    }

    html[data-theme='dark'] {
      --bg: #0d1117;
      --panel: #161b22;
      --sidebar-bg: #0f141b;
      --line: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --code-bg: #161b22;
      --code-border: #30363d;
      --table-head: #161b22;
      --table-zebra: #11161d;
      --brand: #58a6ff;
      --brand-soft: #1f2f46;
      --toc-hover: #21262d;
      --toc-text: #b1bac4;
      --input-bg: #0d1117;
      --btn-bg: #161b22;
      --btn-hover: #21262d;
      --shadow: 0 8px 20px rgba(1, 4, 9, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--panel);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .layout {
      width: 100%;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: grid;
      grid-template-columns: 284px minmax(0, 1fr);
      gap: 0;
      align-items: start;
    }

    .toc-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      max-height: 100vh;
      overflow: auto;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      padding: 18px 14px 24px;
    }

    .toc-panel h2 {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .toc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 6px 14px;
    }

    .toc-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .quick-menu-button,
    .quick-menu-item {
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      background: var(--btn-bg);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .quick-menu-button:hover,
    .quick-menu-item:hover {
      background: var(--btn-hover);
    }

    .quick-menu-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    .quick-menu-item:hover {
      color: var(--brand);
      text-decoration: none;
    }

    .quick-menu-item.is-hidden {
      display: none;
    }

    .toc-filter {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
    }

    .toc-filter:focus {
      border-color: #54aeff;
      box-shadow: 0 0 0 2px rgba(84, 174, 255, 0.2);
    }

    #TOC ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
      border-left: 0;
    }

    #TOC ul ul {
      margin-left: 9px;
      padding-left: 9px;
      border-left: 1px solid var(--line);
    }

    #TOC li {
      margin: 2px 0;
      line-height: 1.3;
      position: relative;
    }

    #TOC a {
      display: block;
      color: var(--toc-text);
      text-decoration: none;
      word-break: break-word;
      border-radius: 6px;
      padding: 6px 8px;
      transition: color 120ms ease, background-color 120ms ease;
    }

    #TOC a:hover {
      color: var(--brand);
      background: var(--toc-hover);
      text-decoration: none;
    }

    #TOC a.active {
      color: #0b4fb3;
      background: var(--brand-soft);
      font-weight: 600;
    }

    #TOC li.has-children > a {
      padding-left: 20px;
    }

    #TOC .toc-toggle {
      position: absolute;
      left: 4px;
      top: 6px;
      width: 14px;
      height: 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 14px;
      text-align: center;
    }

    #TOC li > ul {
      display: none;
    }

    #TOC li.toc-hidden {
      display: none !important;
    }

    #TOC > ul {
      display: block;
    }

    #TOC li.expanded > ul {
      display: block;
    }

    #TOC li.expanded > .toc-toggle {
      transform: rotate(90deg);
    }

    .doc-panel {
      min-width: 0;
      background: var(--panel);
      border: 0;
      border-radius: 0;
      padding: 42px 56px 88px;
    }

    .markdown-body {
      background: transparent !important;
      max-width: 980px;
      margin: 0 auto;
      color: var(--text);
      font-size: 15.5px;
      line-height: 1.75;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      line-height: 1.35;
      font-weight: 600;
      margin-top: 1.35em;
      margin-bottom: 0.55em;
      scroll-margin-top: 12px;
    }

    .markdown-body h1 { font-size: 2em; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1.06em; }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote {
      margin-top: 0;
      margin-bottom: 0.9em;
    }

    .markdown-body pre {
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--code-border);
      background: var(--code-bg);
      overflow: auto;
      line-height: 1.5;
      position: relative;
    }

    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
    }

    .markdown-body pre > code {
      background: transparent !important;
      padding: 0;
      border: 0;
      white-space: pre;
    }

    .markdown-body pre code {
      color: #24292f;
    }

    .markdown-body pre code span.kw,
    .markdown-body pre code span.cf,
    .markdown-body pre code span.er {
      color: #cf222e;
    }

    .markdown-body pre code span.dt,
    .markdown-body pre code span.op,
    .markdown-body pre code span.bu {
      color: #24292f;
    }

    .markdown-body pre code span.st,
    .markdown-body pre code span.vs {
      color: #0a3069;
    }

    .markdown-body pre code span.co,
    .markdown-body pre code span.do {
      color: #6e7781;
      font-style: italic;
    }

    .markdown-body pre code span.an,
    .markdown-body pre code span.at {
      color: #8250df;
    }

    .markdown-body pre code span.fu {
      color: #8250df;
    }

    .markdown-body pre code span.dv,
    .markdown-body pre code span.fl,
    .markdown-body pre code span.bn {
      color: #0550ae;
    }

    .markdown-body pre code span.va {
      color: #953800;
    }

    .markdown-body :not(pre) > code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 0.12em 0.35em;
    }

    .markdown-body pre.http-snippet {
      border-left: 4px solid #1f6feb;
      background: #f8fbff;
    }

    html[data-theme='dark'] .markdown-body pre.http-snippet {
      border-left-color: #58a6ff;
      background: #0f1a27;
    }

    html[data-theme='dark'] .markdown-body pre,
    html[data-theme='dark'] .markdown-body pre > code {
      background: #161b22;
      border-color: #30363d;
      color: #c9d1d9;
    }

    html[data-theme='dark'] .markdown-body pre code span.kw,
    html[data-theme='dark'] .markdown-body pre code span.cf,
    html[data-theme='dark'] .markdown-body pre code span.er {
      color: #ff7b72 !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.dt,
    html[data-theme='dark'] .markdown-body pre code span.op,
    html[data-theme='dark'] .markdown-body pre code span.bu {
      color: #c9d1d9 !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.st,
    html[data-theme='dark'] .markdown-body pre code span.vs {
      color: #a5d6ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.co,
    html[data-theme='dark'] .markdown-body pre code span.do {
      color: #8b949e !important;
      font-style: italic;
    }

    html[data-theme='dark'] .markdown-body pre code span.an,
    html[data-theme='dark'] .markdown-body pre code span.at {
      color: #d2a8ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.fu {
      color: #d2a8ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.dv,
    html[data-theme='dark'] .markdown-body pre code span.fl,
    html[data-theme='dark'] .markdown-body pre code span.bn {
      color: #79c0ff !important;
    }

    html[data-theme='dark'] .markdown-body pre code span.va {
      color: #ffa657 !important;
    }

    html[data-theme='dark'] .markdown-body pre code .http-method { color: #ff7b72; }
    html[data-theme='dark'] .markdown-body pre code .http-url { color: #79c0ff; }
    html[data-theme='dark'] .markdown-body pre code .http-header-key { color: #d2a8ff; }
    html[data-theme='dark'] .markdown-body pre code .http-header-val { color: #c9d1d9; }
    html[data-theme='dark'] .markdown-body pre code .http-placeholder {
      color: #9ecbff;
      background: #1f2f46;
    }

    .markdown-body pre code .http-method {
      color: #cf222e;
      font-weight: 700;
    }

    .markdown-body pre code .http-url {
      color: #0969da;
      font-weight: 600;
    }

    .markdown-body pre code .http-header-key {
      color: #6f42c1;
      font-weight: 600;
    }

    .markdown-body pre code .http-header-val {
      color: #0a3069;
    }

    .markdown-body pre code .http-placeholder {
      color: #0550ae;
      background: #ddf4ff;
      border-radius: 4px;
      padding: 0 2px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.1em 0;
      font-size: 14px;
      table-layout: auto;
    }

    .markdown-body table th,
    .markdown-body table td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
    }

    .markdown-body table thead th {
      background: var(--table-head);
      font-weight: 600;
    }

    .markdown-body table tbody tr:nth-child(even) {
      background: var(--table-zebra);
    }

    .markdown-body table tbody tr:hover {
      background: #eef6ff;
    }

    html[data-theme='dark'] .markdown-body table {
      color: var(--text);
      background: transparent;
    }

    html[data-theme='dark'] .markdown-body table th,
    html[data-theme='dark'] .markdown-body table td {
      border-color: var(--line);
      background: #0f1622;
      color: var(--text);
    }

    html[data-theme='dark'] .markdown-body table thead th {
      background: #182233;
      color: #dbe7f5;
    }

    html[data-theme='dark'] .markdown-body table tbody tr:nth-child(even) td {
      background: #131d2b;
    }

    html[data-theme='dark'] .markdown-body table tbody tr:hover td {
      background: #1a2a3f;
    }

    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      height: 24px;
      min-width: 56px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1;
      padding: 0 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms ease, background-color 120ms ease;
    }

    .markdown-body pre:hover .code-copy-btn,
    .markdown-body pre:focus-within .code-copy-btn {
      opacity: 1;
    }

    .code-copy-btn:hover {
      background: var(--btn-hover);
    }

    .quick-menu {
      position: relative;
      display: inline-flex;
      z-index: 20;
    }

    .quick-menu-panel {
      display: none;
      position: absolute;
      top: 32px;
      right: 0;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .quick-menu.open .quick-menu-panel {
      display: flex;
    }

    .quick-menu-toggle {
      min-width: 74px;
      font-weight: 600;
    }

    .sidebar-toggle {
      min-width: 48px;
      font-weight: 600;
    }

    .sidebar-expand-fab {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 60;
      height: 30px;
      min-width: 56px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    html.sidebar-collapsed .sidebar-expand-fab,
    body.sidebar-collapsed .sidebar-expand-fab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .back-to-top {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .back-to-top.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .back-to-top:hover,
    .sidebar-expand-fab:hover {
      background: var(--btn-hover);
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .toc-panel {
        position: static;
        height: auto;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .doc-panel {
        padding: 28px 20px 72px;
      }

      .back-to-top {
        right: 12px;
        bottom: 12px;
      }

    }
  </style>
  $for(header-includes)$
  $header-includes$
  $endfor$
</head>
<body>
  <div class="layout">
    $if(toc)$
    <aside class="toc-panel">
      <nav id="$idprefix$TOC" role="doc-toc">
        <div class="toc-head">
          <h2>Contents</h2>
          <div class="toc-actions">
            <button id="sidebar-toggle" class="quick-menu-button sidebar-toggle" type="button" aria-label="Collapse sidebar">Hide</button>
            <div id="quick-menu" class="quick-menu">
              <button id="quick-menu-toggle" class="quick-menu-button quick-menu-toggle" type="button" aria-label="Toggle page actions">Actions</button>
              <div id="quick-menu-panel" class="quick-menu-panel" aria-label="Page actions">
                <a id="source-md-link" class="quick-menu-item is-hidden" href="#" download aria-label="Download source markdown">MD</a>
                <button id="quick-theme" class="quick-menu-item" type="button" aria-label="Toggle theme">Dark</button>
              </div>
            </div>
          </div>
        </div>
        <input id="toc-filter" class="toc-filter" type="text" placeholder="Filter headings..." />
        $table-of-contents$
      </nav>
    </aside>
    $endif$
    <main class="doc-panel">
      <article class="markdown-body">
        $body$
      </article>
    </main>
  </div>
  $if(toc)$
  <button id="sidebar-expand-fab" class="sidebar-expand-fab" type="button" aria-label="Expand sidebar">Show</button>
  $endif$
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">&uarr;</button>
  <script>
__PINYIN_MATCH_INLINE__
  </script>
  <noscript>
    <style>
      #TOC li > ul {
        display: block !important;
      }
    </style>
  </noscript>
  <script>
    (function () {
      var root = document.documentElement;
      var body = document.body;
      var sidebarInitReady = false;
      var sourceMdLink = document.getElementById('source-md-link');
      function markSidebarInitReady() {
        if (sidebarInitReady) return;
        root.classList.remove('sidebar-init-pending');
        root.classList.add('sidebar-init-ready');
        sidebarInitReady = true;
      }

      function setupSourceMarkdownLink() {
        var pathname = window.location && window.location.pathname ? window.location.pathname : '';
        var lowerPath = pathname.toLowerCase();
        var suffixLength = lowerPath.slice(-5) === '.html' ? 5 : (lowerPath.slice(-4) === '.htm' ? 4 : 0);
        if (!suffixLength) return;

        var mdPath = pathname.slice(0, pathname.length - suffixLength) + '.md';
        var filename = decodeURIComponent(mdPath.split('/').pop() || 'source.md');

        [sourceMdLink].forEach(function (link) {
          if (!link) return;
          link.href = mdPath;
          link.setAttribute('download', filename);
          link.setAttribute('title', 'Download ' + filename);
          link.classList.remove('is-hidden');
          link.classList.add('show');
        });
      }

      setupSourceMarkdownLink();

      var links = Array.prototype.slice.call(document.querySelectorAll('#TOC a[href^="#"]'));
      var map = links
        .map(function (a) {
          var id = decodeURIComponent((a.getAttribute('href') || '').slice(1));
          return { link: a, target: document.getElementById(id) };
        })
        .filter(function (x) { return x.target; });

      function setActive(link) {
        links.forEach(function (a) { a.classList.remove('active'); });
        if (link) link.classList.add('active');
      }

      function directChild(el, tag) {
        var children = el.children || [];
        for (var i = 0; i < children.length; i++) {
          if ((children[i].tagName || '').toLowerCase() === tag) return children[i];
        }
        return null;
      }

      function isPinyinMatch(text, keyword) {
        var pm = window.PinyinMatch;
        if (!pm || !pm.match) return false;
        try {
          return !!pm.match(text, keyword);
        } catch (e) {
          return false;
        }
      }

      function isHeadingMatch(text, keyword) {
        var t = (text || '').toLowerCase();
        var q = (keyword || '').toLowerCase();
        if (!q) return true;
        if (t.indexOf(q) !== -1) return true;
        return isPinyinMatch(text, keyword);
      }

      var tocRoot = document.getElementById('TOC');
      var filterInput = document.getElementById('toc-filter');
      var quickMenu = document.getElementById('quick-menu');
      var quickMenuToggle = document.getElementById('quick-menu-toggle');
      var quickTheme = document.getElementById('quick-theme');
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var sidebarExpandFab = document.getElementById('sidebar-expand-fab');
      var backToTop = document.getElementById('back-to-top');
      var tocFilterActive = false;
      var tocSaveTimer = null;
      var tocLiByHref = Object.create(null);
      var tocStateKey = 'doc-toc-expanded:' + (window.location && window.location.pathname ? window.location.pathname : '');
      var prefersDark = false;
      try {
        prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {
        prefersDark = false;
      }

      var storedTheme = '';
      try { storedTheme = localStorage.getItem('doc-theme') || ''; } catch (e) { storedTheme = ''; }
      if (storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark)) {
        root.setAttribute('data-theme', 'dark');
      }

      if (root.classList.contains('sidebar-collapsed')) {
        body.classList.add('sidebar-collapsed');
      } else {
        body.classList.remove('sidebar-collapsed');
      }

      function refreshSidebarLabel() {
        if (!sidebarToggle) return;
        var collapsed = body.classList.contains('sidebar-collapsed');
        sidebarToggle.textContent = collapsed ? 'Show' : 'Hide';
        sidebarToggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      }

      function setSidebarCollapsed(collapsed) {
        if (collapsed) {
          root.classList.add('sidebar-collapsed');
          body.classList.add('sidebar-collapsed');
        } else {
          root.classList.remove('sidebar-collapsed');
          body.classList.remove('sidebar-collapsed');
        }
        try { localStorage.setItem('doc-sidebar', collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
        refreshSidebarLabel();
      }

      function clearAllTocExpanded() {
        if (!tocRoot) return;
        Array.prototype.slice.call(tocRoot.querySelectorAll('li.expanded')).forEach(function (li) {
          li.classList.remove('expanded');
        });
      }

      function loadTocExpandedState() {
        var raw = '';
        try {
          raw = localStorage.getItem(tocStateKey) || '[]';
        } catch (e) {
          return [];
        }

        try {
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(function (x) { return typeof x === 'string' && x.charAt(0) === '#'; });
        } catch (e) {
          return [];
        }
      }

      function applyTocExpandedState(ids) {
        if (!tocRoot) return;
        clearAllTocExpanded();
        ids.forEach(function (href) {
          var li = tocLiByHref[href];
          if (li) li.classList.add('expanded');
        });
      }

      function collectTocExpandedState() {
        if (!tocRoot) return [];
        var hrefs = [];
        Array.prototype.slice.call(tocRoot.querySelectorAll('li.expanded')).forEach(function (li) {
          var a = directChild(li, 'a');
          if (!a) return;
          var href = (a.getAttribute('href') || '').trim();
          if (!href || href.charAt(0) !== '#') return;
          hrefs.push(href);
        });
        return hrefs;
      }

      function saveTocExpandedStateNow() {
        if (!tocRoot || tocFilterActive) return;
        try {
          localStorage.setItem(tocStateKey, JSON.stringify(collectTocExpandedState()));
        } catch (e) {}
      }

      function scheduleSaveTocExpandedState() {
        if (!tocRoot || tocFilterActive) return;
        if (tocSaveTimer) clearTimeout(tocSaveTimer);
        tocSaveTimer = setTimeout(function () {
          saveTocExpandedStateNow();
        }, 120);
      }

      function refreshThemeLabel() {
        if (!quickTheme) return;
        quickTheme.textContent = root.getAttribute('data-theme') === 'dark' ? 'Light' : 'Dark';
      }
      refreshThemeLabel();
      refreshSidebarLabel();

      if (quickTheme) {
        quickTheme.addEventListener('click', function () {
          var dark = root.getAttribute('data-theme') === 'dark';
          if (dark) root.removeAttribute('data-theme');
          else root.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('doc-theme', dark ? 'light' : 'dark'); } catch (e) {}
          refreshThemeLabel();
          closeQuickMenu();
        });
      }

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          setSidebarCollapsed(!body.classList.contains('sidebar-collapsed'));
          closeQuickMenu();
        });
      }

      if (sidebarExpandFab) {
        sidebarExpandFab.addEventListener('click', function () {
          setSidebarCollapsed(false);
        });
      }

      function updateBackToTop() {
        if (!backToTop) return;
        if (window.scrollY > 600) backToTop.classList.add('show');
        else backToTop.classList.remove('show');
      }

      if (backToTop) {
        backToTop.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        window.addEventListener('scroll', updateBackToTop, { passive: true });
        updateBackToTop();
      }

      if (sourceMdLink) {
        sourceMdLink.addEventListener('click', function () {
          closeQuickMenu();
        });
      }

      function closeQuickMenu() {
        if (quickMenu) quickMenu.classList.remove('open');
      }

      if (quickMenu && quickMenuToggle) {
        quickMenuToggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          quickMenu.classList.toggle('open');
        });

        quickMenu.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        document.addEventListener('click', closeQuickMenu);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeQuickMenu();
        });
      }

      if (tocRoot) {
        var lis = Array.prototype.slice.call(tocRoot.querySelectorAll('li'));
        lis.forEach(function (li) {
          var child = directChild(li, 'ul');
          var anchor = directChild(li, 'a');
          if (!child || !anchor) return;

          li.classList.add('has-children');
          var href = (anchor.getAttribute('href') || '').trim();
          if (href && href.charAt(0) === '#' && !tocLiByHref[href]) {
            tocLiByHref[href] = li;
          }

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toc-toggle';
          btn.setAttribute('aria-label', 'toggle submenu');
          btn.textContent = '>';
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            li.classList.toggle('expanded');
            scheduleSaveTocExpandedState();
          });

          li.insertBefore(btn, anchor);
        });

        applyTocExpandedState(loadTocExpandedState());
      }

      function showNodeWithContext(li) {
        var n = li;
        while (n && n.tagName && n.tagName.toLowerCase() === 'li') {
          n.classList.remove('toc-hidden');
          n.classList.add('expanded');
          n = n.parentElement ? n.parentElement.closest('li') : null;
        }
      }

      function applyFilter(keyword) {
        if (!tocRoot) return;
        var q = (keyword || '').trim();
        var items = Array.prototype.slice.call(tocRoot.querySelectorAll('li'));

        if (!q) {
          tocFilterActive = false;
          items.forEach(function (li) {
            li.classList.remove('toc-hidden');
          });
          applyTocExpandedState(loadTocExpandedState());
          return;
        }

        tocFilterActive = true;
        items.forEach(function (li) {
          li.classList.add('toc-hidden');
          li.classList.remove('expanded');
        });

        items.forEach(function (li) {
          var a = directChild(li, 'a');
          if (!a) return;
          if (!isHeadingMatch(a.textContent || '', q)) return;

          showNodeWithContext(li);
          Array.prototype.slice.call(li.querySelectorAll('li')).forEach(function (d) {
            d.classList.remove('toc-hidden');
          });
        });
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function markPlaceholders(s) {
        return s.replace(/\{\{[^}]+\}\}/g, function (m) {
          return '<span class="http-placeholder">' + m + '</span>';
        });
      }

      function formatHttpSnippets() {
        var blocks = Array.prototype.slice.call(document.querySelectorAll('.markdown-body pre > code'));
        blocks.forEach(function (code) {
          var pre = code.parentElement;
          if (!pre) return;

          var cls = code.className || '';
          var isHttpLang = /\blanguage-http\b/i.test(cls) || /\blanguage-https\b/i.test(cls);
          if (cls.indexOf('language-') >= 0 && !isHttpLang) return;

          var text = code.textContent || '';
          var lines = text.replace(/\r\n/g, '\n').split('\n');
          if (!lines.length) return;

          var first = (lines[0] || '').trim();
          if (!/^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s+/i.test(first)) return;

          pre.classList.add('http-snippet');
          var html = [];
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (i === 0) {
              var m = line.match(/^([A-Z]+)\s+(\S+)(.*)/i);
              if (m) {
                html.push(
                  '<span class="http-method">' + escapeHtml(m[1].toUpperCase()) + '</span> ' +
                  '<span class="http-url">' + markPlaceholders(escapeHtml(m[2])) + '</span>' +
                  escapeHtml(m[3] || '')
                );
                continue;
              }
            }

            var h = line.match(/^([A-Za-z0-9\-]+)\s*:\s*(.*)/);
            if (h) {
              html.push(
                '<span class="http-header-key">' + escapeHtml(h[1]) + '</span>: ' +
                '<span class="http-header-val">' + markPlaceholders(escapeHtml(h[2])) + '</span>'
              );
            } else {
              html.push(markPlaceholders(escapeHtml(line)));
            }
          }

          code.innerHTML = html.join('\n');
        });
      }

      function setupCopyButtons() {
        function fallbackCopyText(text) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try {
            ok = document.execCommand('copy');
          } catch (e) {
            ok = false;
          }
          document.body.removeChild(ta);
          return ok;
        }

        var blocks = Array.prototype.slice.call(document.querySelectorAll('.markdown-body pre'));
        blocks.forEach(function (pre) {
          var code = pre.querySelector('code');
          if (!code) return;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'code-copy-btn';
          btn.textContent = 'Copy';
          btn.setAttribute('aria-label', 'Copy code');

          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            var raw = code.textContent || '';
            var resetLabel = function () {
              btn.textContent = 'Copy';
            };

            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
              navigator.clipboard.writeText(raw).then(function () {
                btn.textContent = 'Copied';
                setTimeout(resetLabel, 1200);
              }).catch(function () {
                var ok = fallbackCopyText(raw);
                btn.textContent = ok ? 'Copied' : 'Ctrl+C';
                setTimeout(resetLabel, 1200);
              });
            } else {
              var ok2 = fallbackCopyText(raw);
              btn.textContent = ok2 ? 'Copied' : 'Ctrl+C';
              setTimeout(resetLabel, 1200);
            }
          });

          pre.appendChild(btn);
        });
      }

      links.forEach(function (a) {
        a.addEventListener('click', function () {
          setActive(a);
        });
      });

      if (filterInput) {
        var filterTimer = null;
        filterInput.addEventListener('input', function () {
          if (filterTimer) clearTimeout(filterTimer);
          filterTimer = setTimeout(function () {
            applyFilter(filterInput.value);
          }, 100);
        });
      }

      if (map.length) {
        setActive(map[0].link);
      }
      formatHttpSnippets();
      setupCopyButtons();
      markSidebarInitReady();
    })();
  </script>
</body>
</html>
